name: Temporary CALIPER Live Render

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright Chromium
        run: |
          npm init -y
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Render through live Mage Character Forge
        run: node .github/scripts/render-caliper.mjs

      - name: Upload Forge sheet
        uses: actions/upload-artifact@v4
        with:
          name: caliper-forge-sheet
          path: |
            CALIPER-M20-Technocrat.pdf
            characters/CALIPER.mage.json
          if-no-files-found: error
          retention-days: 7
