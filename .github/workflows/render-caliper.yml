name: Render CALIPER Forge Sheet

on:
  push:
    branches:
      - render-caliper-20260818
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install browser
        run: |
          npm init -y
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Render live Forge sheet
        run: |
          cat > render-caliper.mjs <<'EOF'
          import { chromium } from "playwright";
          import fs from "node:fs";

          const character = {"identity":{"name":"Dr. Gabriel Navarro / CALIPER","player":"","chronicle":"City of the Mad","concept":"Transhuman systems-containment operative","nature":"Visionary","demeanor":"Director","essence":"Pattern","society":"Technocratic Union","affiliation":"Iteration X","faction":"BioMechanics","affinitySphere":"Forces","cabal":"","paradigm":"Transcend Your Limits","practice":"Cybernetics","instruments":"Integrated diagnostic implants; augmented sensory architecture; neural co-processor; portable engineering and fabrication tools; field computer and simulations; sensors and measurement gear; calibrated weapons and engineered materials"},"creationMode":"experienced","bonusFreebies":0,"attributePriority":{"Physical":"Secondary","Social":"Tertiary","Mental":"Primary"},"attributes":{"Strength":2,"Dexterity":3,"Stamina":3,"Charisma":2,"Manipulation":2,"Appearance":2,"Perception":3,"Intelligence":4,"Wits":3},"abilityPriority":{"Talents":"Tertiary","Skills":"Primary","Knowledges":"Secondary"},"abilities":{"Alertness":2,"Art":0,"Athletics":1,"Awareness":2,"Brawl":1,"Empathy":0,"Expression":0,"Intimidation":0,"Leadership":0,"Streetwise":0,"Subterfuge":0,"Crafts":2,"Drive":2,"Etiquette":0,"Firearms":3,"Martial Arts":0,"Meditation":0,"Melee":0,"Research":1,"Stealth":1,"Survival":1,"Technology":4,"Academics":0,"Computer":2,"Cosmology":1,"Enigmas":0,"Esoterica":0,"Investigation":2,"Law":0,"Medicine":1,"Occult":0,"Politics":0,"Science":4},"customAbilities":{"Talents":[],"Skills":[],"Knowledges":[]},"specializations":{"attribute:Stamina":"Augmented Endurance","attribute:Perception":"Anomaly Detection","attribute:Intelligence":"Systems Analysis","ability:Technology":"Field Engineering","ability:Science":"Materials Science"},"spheres":{"Correspondence":0,"Entropy":0,"Forces":2,"Life":0,"Matter":3,"Mind":0,"Prime":2,"Spirit":0,"Time":2},"arete":3,"paradox":2,"backgrounds":{"Allies":0,"Arcane":0,"Avatar":3,"Backup":0,"Contacts":1,"Cult":0,"Destiny":0,"Dream":0,"Enhancements":2,"Familiar":0,"Influence":0,"Library":1,"Mentor":0,"Node":0,"Patron":0,"Resources":2,"Sanctum":0,"Spies":0,"Status":0,"Totem":0,"Wonder":0},"customBackgrounds":[],"backgroundNotes":"Genius 3: CALIPER experiences his Genius as a predictive schematic engine that renders stresses, dependencies, and possible improvements as engineering diagrams.\nContacts 1: Albuquerque-area Union-adjacent engineers, contractors, and technical personnel only; no preexisting contacts in the chronicle's target city.\nLibrary 1: encrypted portable field archive of engineering manuals, anomaly case files, and locally cached Union data.\nResources 2: personal income, investments, and equipment independent of Construct requisitions.\nEnhancements 2: Chronicle-granted package. The Forge's normal double Background cost is effectively offset by the required 4-point Enhancement-related Flaw.","enhancementAllocations":{"Strength":0,"Dexterity":0,"Stamina":1,"Appearance":0,"Perception":1,"Intelligence":0,"Health":0},"enhancementDeviceDots":0,"enhancementWonderDots":0,"enhancementForm":"traits","enhancementNotes":"REVISION 4.7 BIOMECHANICAL PLATFORM.\n+1 Stamina: reinforced skeletal interfaces, vascular support, thermal regulation, and redundant shock-management systems.\n+1 Perception: multispectral ocular/aural replacements, sensor fusion, and continuous environmental diagnostics.\nThe package is deliberately visible to CALIPER as an ongoing redesign rather than medical restoration. Each revision is documented, benchmarked, and intended to be surpassed.\nPermanent Paradox 2 is recorded for the two cybernetic Enhancement dots. Required associated Flaw: Faulty Enhancements (4).","willpower":8,"resonanceType":"Static","resonanceSignature":"Precise, geometric, machine-quiet","quintessenceBonus":0,"merits":[],"flaws":[{"id":"faulty-enhancements","name":"Faulty Enhancements","points":4}],"rotes":"ANOMALY SIGNATURE ISOLATION PROTOCOL - Matter 1 + Forces 1 + Prime 1. Proposed pool: Perception + Technology (8 with current Enhancement). Cross-correlates material, energetic, and Primal signatures to identify what is physically or Enlightenedly wrong with a target or scene.\n\nPREDICTIVE THREAT-VECTOR MODEL - Time 2 + Forces 1. Proposed pool: Intelligence + Science (8). Continuous simulation predicts trajectories, imminent collapses, attacks, explosions, and other near-future hazards.\n\nFIELD RECONFIGURATION PROTOCOL - Matter 3. Proposed pool: Intelligence + Technology (8). Uses portable fabrication tools, material analysis, and Enlightened engineering to repair, reshape, repurpose, disable, or improvise from available matter.","equipment":"Concealable service sidearm and spare magazines\nRuggedized field engineering/fabrication kit\nEncrypted diagnostic tablet and local data archive\nPortable spectrographic/material analyzer\nProtective field clothing and conventional body armor\nCompact repair tools, power cells, cabling, probes, and general-purpose components\nNo Backup, Construct, Node, Requisitions, or Secret Weapons assumed for ongoing field access.","history":"Gabriel Navarro was a materials engineer and catastrophic-failure analyst before Enlightenment. During an industrial accident that violated several mutually exclusive failure models at once, everyone else saw chaos; Gabriel saw a system behaving according to rules no one had yet written down. By the time Iteration X arrived, he had already reconstructed most of the event.\n\nHe was recruited into the Albuquerque Construct and became a field specialist in anomalous systems containment: the operative sent into impossible failures to determine what is happening, what will fail next, and what must be repaired, isolated, disabled, or destroyed.\n\nAn early containment mission left his body badly damaged. The first reconstruction was medically necessary. The upgrades after that were not. Gabriel discovered that a body he had participated in designing felt more authentically his than the one chance had assigned him. He now treats himself as an iterative platform, currently Revision 4.7.\n\nHis transhumanism is sincere and consent-centered. He believes stable reality exists so people can safely choose what they become. He does not consider biology sacred, death philosophically inevitable, or 'human' a category that should remain small. He believes sapience and autonomy matter more than substrate. His long-term ambition is a reproducible, civilian-safe path to radical augmentation that does not require Enlightenment.","notes":"CORE PRINCIPLE: Humanity is not something to preserve unchanged. Humanity is something to continue.\n\nCALIPER believes in the Union's duty to keep reality survivable, but increasingly questions whether the Pandora Effect has become an excuse for permanent technological gatekeeping. He distinguishes hazardous anomalies from harmless deviance and is willing to cooperate with non-Union actors when that protects citizens or prevents catastrophe.\n\nConsent is non-negotiable. Enhancement is good; choosing enhancement is better.\n\nField style: measure first, model second, intervene third. He is a credible amalgam-leader candidate, but leads procedurally rather than charismatically.\n\nLikely advancement goal: Enhancement 3, then 4 and 5 as the chronicle progresses, with each new modification visibly changing what CALIPER can do and how he understands personhood.","experience":0,"xpPurchases":[{"id":"xp-forces-2","category":"sphere","key":"Forces","label":"Forces","from":1,"to":2,"cost":7,"approval":"","note":"Chronicle starting XP; Iteration X affinity Sphere","purchasedAt":"2026-08-18T20:16:00.000Z"},{"id":"xp-prime-2","category":"sphere","key":"Prime","label":"Prime","from":1,"to":2,"cost":8,"approval":"","note":"Chronicle starting XP","purchasedAt":"2026-08-18T20:16:00.000Z"},{"id":"xp-time-2","category":"sphere","key":"Time","label":"Time","from":1,"to":2,"cost":8,"approval":"","note":"Chronicle starting XP","purchasedAt":"2026-08-18T20:16:00.000Z"},{"id":"xp-awareness-2","category":"ability","key":"Awareness","label":"Awareness","from":1,"to":2,"cost":2,"approval":"","note":"Chronicle starting XP","purchasedAt":"2026-08-18T20:16:00.000Z"}]};

          fs.writeFileSync("CALIPER.mage.json", JSON.stringify(character, null, 2));

          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1440, height: 1100 } });

          await page.goto("https://edwardcarpenter10.github.io/mage-character-forge/", {
            waitUntil: "networkidle",
            timeout: 60000
          });

          await page.evaluate((data) => {
            localStorage.setItem("mage-character-forge-v3", JSON.stringify(data));
            localStorage.removeItem("mage-character-forge-v2");
            localStorage.removeItem("mage-character-forge-v1");
          }, character);

          await page.reload({ waitUntil: "networkidle", timeout: 60000 });
          await page.waitForTimeout(1500);

          const renderedName = (await page.locator(".print-sheet h1").innerText()).trim();
          if (!renderedName.includes("Gabriel Navarro")) {
            throw new Error(`Forge did not restore CALIPER data; printable name was: ${renderedName}`);
          }

          await page.pdf({
            path: "CALIPER-M20-Technocrat.pdf",
            format: "Letter",
            printBackground: true,
            preferCSSPageSize: true
          });

          const stats = fs.statSync("CALIPER-M20-Technocrat.pdf");
          if (stats.size < 10000) throw new Error("Generated PDF is unexpectedly small.");

          console.log(`Rendered ${renderedName} through the live Forge (${stats.size} bytes).`);
          await browser.close();
          EOF
          node render-caliper.mjs

      - name: Upload Forge outputs
        uses: actions/upload-artifact@v4
        with:
          name: caliper-forge-sheet
          path: |
            CALIPER-M20-Technocrat.pdf
            CALIPER.mage.json
          if-no-files-found: error
          retention-days: 7
