name: Package itch.io release

on:
  pull_request:
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate standalone build
        shell: bash
        run: |
          test -f index.html
          grep -qi '<!doctype html' index.html
          grep -qi '<title>Mage Character Forge</title>' index.html

      - name: Prepare itch package
        shell: bash
        run: |
          mkdir -p itch-package
          cp index.html itch-package/index.html
          cp README.md itch-package/README.md

      - name: Upload itch package
        uses: actions/upload-artifact@v4
        with:
          name: Mage-Character-Forge-ITCH_UPLOAD
          path: itch-package/
          if-no-files-found: error
          retention-days: 14
